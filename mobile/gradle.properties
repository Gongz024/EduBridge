org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Base URL of the Spring Boot API (must end with /api/).
# 10.0.2.2 is the Android emulator's alias for your computer's localhost.
# On a physical phone, use your computer's LAN IP instead, e.g. http://192.168.1.20:8080/api/
# You can also override this in local.properties with: edubridge.apiBaseUrl=...
edubridge.apiBaseUrl=http://10.0.2.2:8080/api/
