spring.application.name=edubridge
spring.datasource.url=jdbc:mysql://localhost:3307/edubridge?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Admin.1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

server.port=8080

# JWT (set JWT_SECRET in production; it must be at least 32 characters)
app.jwt.secret=${JWT_SECRET:edubridge-dev-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# Origins allowed to call the API from a browser
app.cors.allowed-origins=http://localhost:5173
